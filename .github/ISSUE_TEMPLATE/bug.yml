name: Bug / 缺陷
description: 报告可稳定复现的行为错误
title: "fix: "
labels:
  - bug
body:
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 输入、环境、命令或完整请求。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望与实际
      description: 期望结果、实际结果、HTTP/事件/错误码和用户影响。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志、Trace 与测试证据
      description: 只粘贴脱敏摘要，包含 trace_id、stage、status 和 error_code。
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: 回归测试与风险
      description: 应新增哪个 regression/contract/e2e case？如何回滚？
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 安全确认
      options:
        - label: 我已移除 Token、Cookie、Authorization、真实 .env 和个人数据。
          required: true
        - label: 我确认复现过程不会写入生产数据或外部业务系统。
          required: true

name: Feature / 模块能力
description: 提出一个可验收的新能力或受控主链模块迁移
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请用可观察、可测试的语言填写。跨模块 Agent 变更必须同步创建 docs/specs/<name>/ 规格链。
  - type: textarea
    id: problem
    attributes:
      label: 问题与用户价值
      description: 谁遇到什么问题？现在的行为是什么？
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 目标与非目标
      description: 明确本次做什么、不做什么。
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: 影响面
      description: 涉及 API、前端、Agent State、Prompt、工具、数据库、配置和可观测性的哪些部分？
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 写成输入、操作、预期输出/事件/日志/状态。
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: 测试计划
      description: unit、contract、integration、offline eval、Compose E2E、Live E2E 分别怎么验证？
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 风险、回滚与外部服务
      description: 是否涉及真实模型、Tushare、MCP、写操作、费用、数据和回滚？
    validations:
      required: true

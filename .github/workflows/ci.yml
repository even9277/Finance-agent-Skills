name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache

jobs:
  python-quality:
    name: Python quality and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.3"
      - uses: actions/cache@v6
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - name: Install locked Python environment
        run: uv sync --locked --no-install-project --group dev
      - name: Ruff lint
        run: >-
          uv run --locked ruff check
          backend/application/chat backend/infrastructure/chat
          backend/application/memory backend/infrastructure/memory
          backend/config.py backend/main.py
          backend/db/database.py backend/db/migration_runner.py
          backend/db/models.py backend/migrations
          backend/routers/chat.py backend/schemas/chat.py
          backend/services/memory_service.py
          backend/services/stm_compaction_worker.py
          backend/services/stm_context_service.py
          Financial-MCP-Agent/src/conversation
          Financial-MCP-Agent/src/memory/contracts.py
          Financial-MCP-Agent/src/memory/memory_service.py
          Financial-MCP-Agent/src/memory/policy.py
          Financial-MCP-Agent/src/memory/working_state.py
          Financial-MCP-Agent/src/prompts/chat/registry.py
          Financial-MCP-Agent/src/tools/skill_trace.py tests
      - name: Pyright boundary check
        run: >-
          uv run --locked pyright
          backend/application/chat backend/infrastructure/chat
          backend/application/memory backend/infrastructure/memory
          backend/config.py backend/main.py
          backend/db/database.py backend/db/migration_runner.py
          backend/db/models.py backend/migrations
          backend/routers/chat.py backend/schemas/chat.py
          backend/services/memory_service.py
          backend/services/stm_compaction_worker.py
          backend/services/stm_context_service.py
          Financial-MCP-Agent/src/conversation
          Financial-MCP-Agent/src/memory/contracts.py
          Financial-MCP-Agent/src/memory/memory_service.py
          Financial-MCP-Agent/src/memory/policy.py
          Financial-MCP-Agent/src/memory/working_state.py
          Financial-MCP-Agent/src/prompts/chat/registry.py
          Financial-MCP-Agent/src/tools/skill_trace.py tests
      - name: Backend offline tests
        run: uv run --locked pytest backend -q
      - name: Agent offline tests
        run: uv run --locked pytest Financial-MCP-Agent -q -m "not live"
      - name: Offline eval smoke
        run: uv run --locked pytest tests/evals -q -m "eval_smoke and not live"
      - name: Root regression
        run: uv run --locked pytest -q

  frontend-quality:
    name: Frontend lint, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend environment
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Production build
        run: npm run build

  compose-config:
    name: Docker packaging and Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Create safe Compose env placeholders
        run: touch Financial-MCP-Agent/.env backend/.env
      - name: Validate Compose file
        run: docker compose -f docker/docker-compose.yml config --quiet
      - name: Verify Redis cache rollback override
        env:
          ENABLE_REDIS_CACHE: "false"
        run: |
          docker compose -f docker/docker-compose.yml config --format json > /tmp/compose.json
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("/tmp/compose.json").read_text())
          backend = config["services"]["backend"]
          assert backend["environment"]["ENABLE_REDIS_CACHE"] == "false"
          assert "redis" not in backend.get("depends_on", {})
          PY
      - name: Build production backend image
        run: docker build -f docker/Dockerfile.backend -t finance-agent-backend-ci:local .
      - name: Verify production migration dependency
        run: >-
          docker run --rm --entrypoint python finance-agent-backend-ci:local
          -c "import alembic, redis; from backend.db.migration_runner import upgrade_database; from backend.infrastructure.memory.summary import build_summary_model_provider; from backend.infrastructure.memory.redis_cache import RedisMemoryHotCache; from backend.infrastructure.memory.runtime import get_memory_cache; from backend.services.stm_compaction_worker import build_stm_compaction_worker; print(alembic.__version__, redis.__version__)"

  offline-compose-e2e:
    name: Offline Compose E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Run isolated PostgreSQL and offline E2E container
        run: >-
          docker compose -f docker/docker-compose.offline.yml
          up --build --abort-on-container-exit --exit-code-from offline-e2e
      - name: Collect and remove E2E resources
        if: always()
        run: docker compose -f docker/docker-compose.offline.yml down -v --remove-orphans

skill_name: fund-compare
skill_family: financial-sop
version: "1.0.0"
depends_on_tools:
  - get_fund_basic_info
  - get_fund_nav
  - get_fund_market_bars
  - get_fund_share
min_tool_schema_version: "1.0.0"
output_schema_version: "1.0.0"
skill_md_section_map:
  purpose: Purpose
  when_to_use: When to Use
  when_not_to_use: When Not to Use
  required_inputs: Required Inputs
  workflow: Workflow
  tool_use_guide: Tool Use Guide
  evidence_rules: Evidence Rules
  degrade_policy: Degrade Policy
  output_contract: Output Contract
  references: References
requires_web_news: false
execution_policy: deterministic
route_metadata:
  when_to_use:
    - 比较两只或多只基金、ETF、LOF、QDII 的费用、规模、净值、流动性和适配人群
    - 用户问“哪只更适合我”“A 和 B 怎么选”“两只基金对比”
  when_not_to_use:
    - 用户只问基金、ETF 的静态概念解释
    - 用户只要求解释单个标的当天涨跌原因
  trigger_examples:
    - 华安黄金 ETF 和博时黄金 ETF 哪个适合我
    - 这两只基金费率和规模对比一下
  anti_trigger_examples:
    - 黄金 ETF 是什么
    - 黄金 ETF 今天为什么涨
  supported_entity_types:
    - fund
    - etf
    - lof
    - qdii
input_contract:
  required_slots:
    - fund_subjects
  entity_cardinality: at_least_two
  supported_entity_types:
    - fund
    - etf
    - lof
    - qdii
  on_missing_slots: ask_clarification
  comparison_required: true
allowed_tools:
  - get_fund_basic_info
  - get_fund_nav
  - get_fund_market_bars
  - get_fund_share
tool_plan_steps:
  - step: discover_funds
    tool: get_fund_basic_info
    required: true
    repeat_for_each_subject: true
    arguments:
      limit: 5
  - step: compare_nav
    tool: get_fund_nav
    required: false
    repeat_for_each_subject: true
    arguments:
      limit: 6
  - step: compare_market_bars
    tool: get_fund_market_bars
    required: false
    repeat_for_each_subject: true
    arguments:
      limit: 10
  - step: compare_share
    tool: get_fund_share
    required: false
    repeat_for_each_subject: true
    arguments:
      limit: 6
required_evidence:
  min_distinct_symbols: 2
  must_have_all:
    - fund_basic
  per_symbol_must_have_any:
    - fund_nav
    - fund_daily
    - fund_share
output_template:
  default_section_order:
    - conclusion
    - comparison
    - risks
    - fit
    - sources
  response_pref_overrides:
    risk_first:
      section_order:
        - risks
        - conclusion
        - comparison
        - fit
        - sources
      style_variant: risk_first
    concise:
      section_order:
        - conclusion
        - comparison
        - risks
        - sources
      style_variant: concise
degrade_policy:
  stages:
    - name: primary
      next_stage: partial_compare
    - name: partial_compare
      next_stage: graceful_decline
    - name: graceful_decline
      next_stage: none
  when_missing_evidence: graceful_decline
concurrency:
  enabled: true
  batch_size: 5

skill_name: stock-first-pass
skill_family: financial-sop
version: "1.0.0"
depends_on_tools:
  - get_stock_basic_info
  - get_market_bars
  - get_fina_indicator
  - get_income
  - get_balance_sheet
  - get_cashflow
min_tool_schema_version: "1.0.0"
output_schema_version: "1.0.0"
skill_md_section_map:
  purpose: Purpose
  when_to_use: When to Use
  when_not_to_use: When Not to Use
  required_inputs: Required Inputs
  workflow: Workflow
  tool_use_guide: Tool Use Guide
  evidence_rules: Evidence Rules
  degrade_policy: Degrade Policy
  output_contract: Output Contract
  references: References
requires_web_news: false
execution_policy: deterministic
route_metadata:
  when_to_use:
    - 用户要求对单只股票做首轮基本面、行情和风险研判
    - 用户问这只股票怎么看、值不值得继续关注
  when_not_to_use:
    - 用户比较基金、筛选 ETF 或询问板块热点
    - 用户重点询问当天异动和新闻原因
  positive_examples:
    - 贵州茅台现在怎么看
    - 中芯国际还值得继续跟踪吗
  negative_examples:
    - 华安黄金 ETF 和博时黄金 ETF 哪个适合我
    - 半导体板块今天为什么突然拉升
  supported_entity_types:
    - stock
input_contract:
  required_slots:
    - stock_subject
  optional_slots:
    - time_scope
    - risk_preference
  entity_cardinality: exactly_one
  supported_entity_types:
    - stock
  on_missing_slots: ask_clarification
allowed_tools:
  - get_stock_basic_info
  - get_market_bars
  - get_fina_indicator
  - get_income
  - get_balance_sheet
  - get_cashflow
tool_plan_steps:
  - step: identify_stock
    tool: get_stock_basic_info
    required: true
    arguments:
      limit: 3
  - step: inspect_recent_market
    tool: get_market_bars
    required: true
    arguments:
      limit: 20
  - step: inspect_key_financial_indicators
    tool: get_fina_indicator
    required: true
    arguments:
      limit: 6
  - step: inspect_income_quality
    tool: get_income
    required: false
    arguments:
      limit: 4
  - step: inspect_balance_sheet
    tool: get_balance_sheet
    required: false
    arguments:
      limit: 4
  - step: inspect_cashflow_quality
    tool: get_cashflow
    required: false
    arguments:
      limit: 4
required_evidence:
  must_have_all:
    - stock_basic
    - stock_market
    - financial_indicator
  must_have_any:
    - income_statement
    - balance_sheet
    - cashflow_statement
output_template:
  default_section_order:
    - conclusion
    - evidence
    - risks
    - fit
    - next_steps
    - sources
  response_pref_overrides:
    risk_first:
      section_order:
        - risks
        - conclusion
        - evidence
        - fit
        - next_steps
        - sources
      style_variant: risk_first
    concise:
      section_order:
        - conclusion
        - evidence
        - risks
        - sources
      style_variant: concise
degrade_policy:
  stages:
    - name: primary
      next_stage: partial_assessment
    - name: partial_assessment
      next_stage: graceful_decline
    - name: graceful_decline
      next_stage: none
  when_missing_evidence: graceful_decline
concurrency:
  enabled: true
  batch_size: 6

skill_name: market-move-explain
skill_family: financial-sop
version: "1.1.0"
depends_on_tools:
  - get_stock_basic_info
  - get_market_bars
  - get_index_bars
  - get_sector_snapshot
  - get_sector_constituents
  - get_fund_basic_info
  - get_fund_market_bars
  - search_web_news
min_tool_schema_version: "1.0.0"
output_schema_version: "1.0.0"
skill_md_section_map:
  purpose: Purpose
  when_to_use: When to Use
  when_not_to_use: When Not to Use
  required_inputs: Required Inputs
  workflow: Workflow
  tool_use_guide: Tool Use Guide
  evidence_rules: Evidence Rules
  degrade_policy: Degrade Policy
  output_contract: Output Contract
  references: References
requires_web_news: true
execution_policy: deterministic
route_metadata:
  when_to_use:
    - 解释股票、基金、ETF、指数、板块的近期上涨、下跌、异动或突然拉升原因
    - 用户问“为什么涨/跌”“今天为什么突然拉了”“异动原因”
  when_not_to_use:
    - 用户要求筛选 ETF 或基金候选
    - 用户只问概念定义或投资方法论
  trigger_examples:
    - 新能源板块今天为什么突然拉了
    - 黄金 ETF 最近为什么涨
  anti_trigger_examples:
    - 黄金 ETF 是什么
    - 帮我筛几只黄金 ETF
  supported_entity_types:
    - stock
    - fund
    - etf
    - index
    - sector
input_contract:
  required_slots:
    - move_subject
  optional_slots:
    - entity_type
    - time_scope
    - sector_name
    - index_code
  entity_cardinality: exactly_one
  supported_entity_types:
    - stock
    - fund
    - etf
    - index
    - sector
    - theme
  on_missing_slots: ask_clarification
allowed_tools:
  - get_stock_basic_info
  - get_market_bars
  - get_index_bars
  - get_sector_snapshot
  - get_sector_constituents
  - get_fund_basic_info
  - get_fund_market_bars
  - search_web_news
tool_plan_steps:
  - step: identify_stock_context
    tool: get_stock_basic_info
    required: false
    arguments:
      limit: 3
  - step: inspect_stock_market_move
    tool: get_market_bars
    required: false
    arguments:
      limit: 20
  - step: inspect_index_context
    tool: get_index_bars
    required: false
    arguments:
      limit: 10
  - step: inspect_sector_snapshot
    tool: get_sector_snapshot
    required: false
    arguments:
      limit: 10
  - step: inspect_sector_constituents
    tool: get_sector_constituents
    required: false
    arguments:
      limit: 10
  - step: identify_fund_context
    tool: get_fund_basic_info
    required: false
    arguments:
      limit: 5
  - step: inspect_fund_market_move
    tool: get_fund_market_bars
    required: false
    arguments:
      limit: 10
  - step: scan_recent_web_news
    tool: search_web_news
    required: false
    arguments:
      max_results: 5
      freshness_days: 7
required_evidence:
  must_have_any:
    - stock_market
    - fund_daily
    - index_daily
    - sector_snapshot
output_template:
  default_section_order:
    - conclusion
    - confirmed_facts
    - web_signals
    - possible_drivers
    - risks
    - sources
  response_pref_overrides:
    risk_first:
      section_order:
        - risks
        - conclusion
        - confirmed_facts
        - web_signals
        - possible_drivers
        - sources
      style_variant: risk_first
    concise:
      section_order:
        - conclusion
        - confirmed_facts
        - risks
        - sources
      style_variant: concise
degrade_policy:
  stages:
    - name: primary
      next_stage: partial_explain
    - name: partial_explain
      next_stage: graceful_decline
    - name: graceful_decline
      next_stage: none
  when_missing_evidence: graceful_decline
concurrency:
  enabled: true
  batch_size: 6

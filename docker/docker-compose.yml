services:
  # ─────────────────────────────────────────
  # PostgreSQL + pgvector（Phase 3 LTM 依赖）
  # Phase 1 使用 SQLite，此服务可选启动
  # ─────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance123
      POSTGRES_DB: finance_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # FastAPI 后端
  # ─────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: finance_backend
    restart: unless-stopped
    env_file:
      - ../Financial-MCP-Agent/.env
      - ../backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://finance:finance123@postgres:5432/finance_db
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DB=finance_db
      - PG_USER=finance
      - PG_PASSWORD=finance123
      - FINANCE_MCP_SERVER_DIR=/app/a-share-mcp-is-just-i-need
    volumes:
      - ../Financial-MCP-Agent/logs:/app/Financial-MCP-Agent/logs
      - ../Financial-MCP-Agent/reports:/app/Financial-MCP-Agent/reports
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────
  # Vue 3 前端（生产构建）
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: finance_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finance_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin123456
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:

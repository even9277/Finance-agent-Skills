x-e2e-python-image: &e2e-python-image
  image: finance-agent-offline-e2e:local
  build:
    context: ..
    dockerfile: docker/Dockerfile.e2e

services:
  redis-e2e:
    image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres-e2e:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: e2e
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d e2e"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres-migration-e2e:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: e2e_migration
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d e2e_migration"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    <<: *e2e-python-image
    command:
      - uv
      - run
      - --locked
      - uvicorn
      - tests.e2e.offline_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://e2e:e2e@postgres-e2e:5432/e2e
      AUTH_ENABLED: "false"
      OPENAI_API_KEY: ""
      OPENAI_COMPATIBLE_API_KEY: ""
      TUSHARE_TOKEN: ""
      ENABLE_LANGFUSE: "false"
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
      ENABLE_MEMORY: "true"
      MEMORY_SEMANTIC_PROVIDER: deterministic
      MEMORY_EMBEDDING_PROVIDER: deterministic
      ENABLE_REDIS_CACHE: "true"
      REDIS_URL: redis://redis-e2e:6379/0
      REDIS_CACHE_NAMESPACE: finance-offline-e2e
      ENABLE_REPORT_TASK_GOVERNANCE: "true"
      ENABLE_REPORT_TASK_REDIS: "true"
      REPORT_TASK_REDIS_NAMESPACE: finance-report-offline-e2e
      REPORT_TASK_SNAPSHOT_TTL_SEC: "900"
      REPORT_TASK_RECONCILE_SEC: "0.25"
      OFFLINE_E2E_REPORT_STAGE_DELAY_SECONDS: "0.25"
      OFFLINE_BACKEND_INSTANCE: primary
      OFFLINE_REPORT_INVOCATION_PATH: /test-artifacts/report_workflow_invocations.jsonl
      ENABLE_STM: "true"
      STM_SUMMARY_PROVIDER: deterministic
      STM_COMPRESSION_STRATEGY: legacy_count
      STM_LEGACY_COUNT_THRESHOLD: "4"
      STM_KEEP_RECENT: "2"
      STM_WORKER_INTERVAL_SEC: "1"
      ENABLE_TRACE: "true"
      CHAT_TRACE_JSONL_PATH: /test-artifacts/chat_traces.jsonl
    volumes:
      - trace-e2e:/test-artifacts
    depends_on:
      postgres-e2e:
        condition: service_healthy
      redis-e2e:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --locked
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 2s
      timeout: 5s
      retries: 20

  backend-secondary:
    <<: *e2e-python-image
    command:
      - uv
      - run
      - --locked
      - uvicorn
      - tests.e2e.offline_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://e2e:e2e@postgres-e2e:5432/e2e
      AUTH_ENABLED: "false"
      OPENAI_API_KEY: ""
      OPENAI_COMPATIBLE_API_KEY: ""
      TUSHARE_TOKEN: ""
      ENABLE_LANGFUSE: "false"
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
      ENABLE_MEMORY: "true"
      MEMORY_SEMANTIC_PROVIDER: deterministic
      MEMORY_EMBEDDING_PROVIDER: deterministic
      ENABLE_REDIS_CACHE: "true"
      REDIS_URL: redis://redis-e2e:6379/0
      REDIS_CACHE_NAMESPACE: finance-offline-e2e
      ENABLE_REPORT_TASK_GOVERNANCE: "true"
      ENABLE_REPORT_TASK_REDIS: "true"
      REPORT_TASK_REDIS_NAMESPACE: finance-report-offline-e2e
      REPORT_TASK_SNAPSHOT_TTL_SEC: "900"
      REPORT_TASK_RECONCILE_SEC: "0.25"
      OFFLINE_E2E_REPORT_STAGE_DELAY_SECONDS: "0.25"
      OFFLINE_BACKEND_INSTANCE: secondary
      OFFLINE_REPORT_INVOCATION_PATH: /test-artifacts/report_workflow_invocations.jsonl
      ENABLE_STM: "true"
      STM_SUMMARY_PROVIDER: deterministic
      STM_COMPRESSION_STRATEGY: legacy_count
      STM_LEGACY_COUNT_THRESHOLD: "4"
      STM_KEEP_RECENT: "2"
      STM_WORKER_INTERVAL_SEC: "1"
      ENABLE_TRACE: "true"
      CHAT_TRACE_JSONL_PATH: /test-artifacts/chat_traces.jsonl
    volumes:
      - trace-e2e:/test-artifacts
    depends_on:
      postgres-e2e:
        condition: service_healthy
      redis-e2e:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --locked
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 2s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
      backend-secondary:
        condition: service_healthy
    volumes:
      - ./nginx/offline.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 2s
      timeout: 5s
      retries: 20

  offline-e2e:
    <<: *e2e-python-image
    environment:
      RUN_D06_ISOLATED_INFRA_TESTS: "true"
      TEST_DATABASE_URL: postgresql+asyncpg://e2e:e2e@postgres-e2e:5432/e2e
      TEST_MIGRATION_DATABASE_URL: postgresql+asyncpg://e2e:e2e@postgres-migration-e2e:5432/e2e_migration
      TEST_REDIS_URL: redis://redis-e2e:6379/15
      TEST_REPORT_REDIS_URL: redis://redis-e2e:6379/0
      OFFLINE_STACK_BASE_URL: http://frontend
      OFFLINE_PRIMARY_BACKEND_URL: http://backend:8000
      OFFLINE_SECONDARY_BACKEND_URL: http://backend-secondary:8000
      AUTH_ENABLED: "false"
      OPENAI_API_KEY: ""
      OPENAI_COMPATIBLE_API_KEY: ""
      TUSHARE_TOKEN: ""
      ENABLE_LANGFUSE: "false"
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
      ENABLE_MEMORY: "true"
      MEMORY_SEMANTIC_PROVIDER: deterministic
      MEMORY_EMBEDDING_PROVIDER: deterministic
      ENABLE_REDIS_CACHE: "true"
      ENABLE_STM: "true"
      STM_SUMMARY_PROVIDER: deterministic
      STM_COMPRESSION_STRATEGY: legacy_count
      STM_LEGACY_COUNT_THRESHOLD: "4"
      STM_KEEP_RECENT: "2"
      OFFLINE_TRACE_PATH: /test-artifacts/chat_traces.jsonl
      OFFLINE_REPORT_INVOCATION_PATH: /test-artifacts/report_workflow_invocations.jsonl
    volumes:
      - trace-e2e:/test-artifacts:ro
    depends_on:
      postgres-e2e:
        condition: service_healthy
      postgres-migration-e2e:
        condition: service_healthy
      redis-e2e:
        condition: service_healthy
      backend:
        condition: service_healthy
      backend-secondary:
        condition: service_healthy
      frontend:
        condition: service_healthy

networks:
  default:
    internal: true

volumes:
  trace-e2e:
